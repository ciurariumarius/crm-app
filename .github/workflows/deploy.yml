name: Deploy to CloudPanel

on:
  push:
    branches:
      - main # Trigger deployment when pushing to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}     # Your VPS IP address or Domain
          username: ${{ secrets.SERVER_USER }} # Your CloudPanel Site User (e.g., crm-user)
          password: ${{ secrets.SERVER_PASSWORD }} # Your Site User password (or use ssh_key instead)
          port: 22                             # Default SSH port
          script: |
            # Navigate to the site folder
            SITE_PATH="/home/${{ secrets.SERVER_USER }}/htdocs/crm.populatia.ro"
            DB_PATH="/home/${{ secrets.SERVER_USER }}/htdocs/crm.populatia.ro/dev.db"
            export DATABASE_URL="file:$DB_PATH"
            cd "$SITE_PATH" || exit 1
            
            # Configure Git to trust the workspace folder
            git config --global --add safe.directory "$SITE_PATH"

            # Pull the latest code
            echo "Fetching latest code..."
            git fetch origin main
            git reset --hard origin/main
            
            # Reinstall dependencies
            echo "Reinstalling dependencies..."
            rm -rf node_modules package-lock.json || true
            npm install --include=dev > build_install.log 2>&1 || (cat build_install.log && exit 1)
            
            # Update Prisma ORM
            echo "Generating Prisma Client..."
            npx prisma generate > build_prisma.log 2>&1 || (cat build_prisma.log && exit 1)
            
            echo "Syncing database schema..."
            # Try to push schema changes
            npx prisma db push --accept-data-loss >> build_prisma.log 2>&1 || (echo "Prisma push failed, trying manually..." && cat build_prisma.log)

            # Manual SQLite migration for critical tables
            echo "Ensuring critical tables exist..."
            sqlite3 "$DB_PATH" "
              CREATE TABLE IF NOT EXISTS tenants (id TEXT PRIMARY KEY, name TEXT NOT NULL, created_at DATETIME DEFAULT CURRENT_TIMESTAMP, updated_at DATETIME DEFAULT CURRENT_TIMESTAMP);
              CREATE TABLE IF NOT EXISTS rate_limit_entries (key TEXT PRIMARY KEY, count INTEGER NOT NULL DEFAULT 0, reset_at DATETIME NOT NULL, created_at DATETIME DEFAULT CURRENT_TIMESTAMP, updated_at DATETIME DEFAULT CURRENT_TIMESTAMP);
              CREATE TABLE IF NOT EXISTS audit_logs (id TEXT PRIMARY KEY, tenant_id TEXT, actor_user_id TEXT, action TEXT NOT NULL, success INTEGER NOT NULL DEFAULT 1, ip_address TEXT, user_agent TEXT, details TEXT, created_at DATETIME DEFAULT CURRENT_TIMESTAMP);
            " || true
            
            # Build the Next.js application
            echo "Building application..."
            npm run build > build_next.log 2>&1 || (cat build_next.log && exit 1)
            
            # Restart the Next.js app
            echo "Restarting application..."
            pm2 restart all || npx pm2 restart all
