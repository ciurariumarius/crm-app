name: Deploy to CloudPanel

on:
  push:
    branches:
      - main # Trigger deployment when pushing to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}     # Your VPS IP address or Domain
          username: ${{ secrets.SERVER_USER }} # Your CloudPanel Site User (e.g., crm-user)
          password: ${{ secrets.SERVER_PASSWORD }} # Your Site User password (or use ssh_key instead)
          port: 22                             # Default SSH port
          script: |
            # Navigate to the site folder (Update the domain to your actual folder name!)
            cd /home/${{ secrets.SERVER_USER }}/htdocs/crm.populatia.ro || exit 1
            
            # Configure Git to trust the workspace folder
            git config --global --add safe.directory /home/${{ secrets.SERVER_USER }}/htdocs/crm.populatia.ro

            # Stop the app first to release any open file locks (like Prisma engines)
            pm2 stop all || npx pm2 stop all || true

            # Forcefully pull the latest code from GitHub, discarding local changes
            git fetch origin main
            git reset --hard origin/main
            
            # Clear node_modules to avoid ENOTEMPTY and Permission errors, then reinstall
            rm -rf node_modules package-lock.json || true
            npm install --include=dev
            
            # Update Prisma ORM (force sync schema to fix missing tables)
            # The app DB is at ./dev.db in the app folder
            APP_DB="./dev.db"
            
            # Create missing tables directly via sqlite3
            sqlite3 "$APP_DB" "
              CREATE TABLE IF NOT EXISTS tenants (
                id TEXT PRIMARY KEY,
                name TEXT NOT NULL,
                created_at DATETIME DEFAULT CURRENT_TIMESTAMP,
                updated_at DATETIME DEFAULT CURRENT_TIMESTAMP
              );
              INSERT OR IGNORE INTO tenants (id, name) SELECT DISTINCT tenant_id, 'Default' FROM users WHERE tenant_id IS NOT NULL LIMIT 1;
              
              CREATE TABLE IF NOT EXISTS rate_limit_entries (
                key TEXT PRIMARY KEY,
                count INTEGER NOT NULL DEFAULT 0,
                reset_at DATETIME NOT NULL,
                created_at DATETIME DEFAULT CURRENT_TIMESTAMP,
                updated_at DATETIME DEFAULT CURRENT_TIMESTAMP
              );
              
              CREATE TABLE IF NOT EXISTS audit_logs (
                id TEXT PRIMARY KEY,
                tenant_id TEXT,
                actor_user_id TEXT,
                action TEXT NOT NULL,
                success INTEGER NOT NULL DEFAULT 1,
                ip_address TEXT,
                user_agent TEXT,
                details TEXT,
                created_at DATETIME DEFAULT CURRENT_TIMESTAMP
              );

              CREATE TABLE IF NOT EXISTS project_rollovers (
                id TEXT PRIMARY KEY,
                tenant_id TEXT NOT NULL,
                source_project_id TEXT NOT NULL,
                new_project_id TEXT,
                target_year INTEGER NOT NULL,
                target_month INTEGER NOT NULL,
                created_at DATETIME DEFAULT CURRENT_TIMESTAMP
              );
              
              -- Add missing columns to existing tables
              ALTER TABLE projects ADD COLUMN description TEXT;
            " 2>/dev/null || true
            
            DATABASE_URL="file:./dev.db" npx prisma generate
            
            # Build the Next.js application
            npm run build
            
            # Restart the Next.js app (using global PM2 managed by CloudPanel)
            pm2 restart all || npx pm2 restart all
