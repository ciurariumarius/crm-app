name: Deploy to CloudPanel

on:
  push:
    branches:
      - main # Trigger deployment when pushing to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script: |
            SITE_PATH="/home/${{ secrets.SERVER_USER }}/htdocs/crm.populatia.ro"
            DB_PATH="/home/${{ secrets.SERVER_USER }}/htdocs/crm.populatia.ro/dev.db"
            export DATABASE_URL="file:$DB_PATH"
            cd "$SITE_PATH" || exit 1
            
            # Pull code
            git fetch origin main
            git reset --hard origin/main
            
            # Dependencies
            npm install --include=dev || true
            
            # Prisma
            npx prisma generate
            
            # Manual Migration for critical missing tables
            echo "Ensuring tables exist..."
            sqlite3 "$DB_PATH" "
              CREATE TABLE IF NOT EXISTS tenants (id TEXT PRIMARY KEY, name TEXT NOT NULL, created_at DATETIME DEFAULT CURRENT_TIMESTAMP, updated_at DATETIME DEFAULT CURRENT_TIMESTAMP);
              CREATE TABLE IF NOT EXISTS rate_limit_entries (key TEXT PRIMARY KEY, count INTEGER NOT NULL DEFAULT 0, reset_at DATETIME NOT NULL, created_at DATETIME DEFAULT CURRENT_TIMESTAMP, updated_at DATETIME DEFAULT CURRENT_TIMESTAMP);
              CREATE TABLE IF NOT EXISTS audit_logs (id TEXT PRIMARY KEY, tenant_id TEXT, actor_user_id TEXT, action TEXT NOT NULL, success INTEGER NOT NULL DEFAULT 1, ip_address TEXT, user_agent TEXT, details TEXT, created_at DATETIME DEFAULT CURRENT_TIMESTAMP);
            " || true
            
            # Build
            npm run build
            # Define PM2 absolute path for reliability
            PM2_BIN="/home/${{ secrets.SERVER_USER }}/htdocs/../.nvm/versions/node/v22.22.0/bin/pm2"
            
            # Restart the Next.js app
            ( $PM2_BIN delete pixelist-crm || true )
            DATABASE_URL="file:$DB_PATH" $PM2_BIN start npm --name "pixelist-crm" -- start
            
            # Final Check
            $PM2_BIN save || true
            echo "--- PM2 STATUS ---"
            $PM2_BIN status
            echo "--- PM2 LOGS (TAIL 100) ---"
            $PM2_BIN logs pixelist-crm --lines 100 --nostream
            
            echo "--- NETWORK STATUS (PORT 3000) ---"
            netstat -tan | grep 3000 || true
            ss -lntu | grep 3000 || true

