name: Deploy to CloudPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script: |
            set -e
            SITE_PATH="/home/${{ secrets.SERVER_USER }}/htdocs/crm.populatia.ro"
            DB_PATH="$SITE_PATH/dev.db"
            
            cd "$SITE_PATH"
            
            echo "--- PULLING LATEST CODE ---"
            git fetch origin main
            git reset --hard origin/main
            
            echo "--- INSTALLING DEPENDENCIES ---"
            npm install || npm install --legacy-peer-deps
            
            echo "--- GENERATING PRISMA CLIENT ---"
            npx prisma generate
            
            echo "--- BUILDING APPLICATION ---"
            export NODE_OPTIONS="--max-old-space-size=2048"
            npm run build
            
            echo "--- RESTARTING PM2 PROCESS ---"
            export NVM_DIR="/home/${{ secrets.SERVER_USER }}/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            
            pm2 delete pixelist-crm || true
            DATABASE_URL="file:$DB_PATH" pm2 start npx --name "pixelist-crm" -- next start -p 3000
            
            pm2 save || true
            echo "--- DEPLOYMENT COMPLETED SUCCESSFULLY ---"
