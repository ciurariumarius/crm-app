name: Deploy to CloudPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Deployment Utilities
        run: sudo apt-get update && sudo apt-get install -y sshpass rsync

      - name: Run Direct Server Deploy
        run: bash scripts/deploy-direct.sh
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: 22
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          SITE_PATH: "/home/${{ secrets.SERVER_USER }}/htdocs/crm.pixelist.ro"
