name: Deploy to CloudPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script: |
            set -e
            SITE_PATH="/home/${{ secrets.SERVER_USER }}/htdocs/crm.populatia.ro"
            DB_PATH="$SITE_PATH/dev.db"
            PM2_BIN="/home/${{ secrets.SERVER_USER }}/.nvm/versions/node/v22.22.0/bin/pm2"
            
            cd "$SITE_PATH"
            
            echo "--- CLEANUP ---"
            rm -rf .next
            
            echo "--- PULL ---"
            git fetch origin main
            git reset --hard origin/main
            
            echo "--- INSTALL ---"
            npm install || npm install --legacy-peer-deps
            
            echo "--- PRISMA ---"
            npx prisma generate
            
            echo "--- BUILD ---"
            # Limit memory for Next build to prevent OOM
            NODE_OPTIONS="--max-old-space-size=2048" npm run build
            
            echo "--- VERIFY BUILD ---"
            if [ ! -d ".next" ]; then
              echo "ERROR: .next directory was not created!"
              exit 1
            fi
            ls -la .next | head -n 10
            
            echo "--- RESTART PM2 ---"
            ( $PM2_BIN delete pixelist-crm || true )
            # Start directly with npx next start to be sure
            DATABASE_URL="file:$DB_PATH" $PM2_BIN start npx --name "pixelist-crm" -- next start -p 3000
            
            $PM2_BIN save || true
            echo "--- DEPLOY SUCCESS ---"
