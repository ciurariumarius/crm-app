name: Deploy to CloudPanel

on:
  push:
    branches:
      - main # Trigger deployment when pushing to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}     # Your VPS IP address or Domain
          username: ${{ secrets.SERVER_USER }} # Your CloudPanel Site User (e.g., crm-user)
          password: ${{ secrets.SERVER_PASSWORD }} # Your Site User password (or use ssh_key instead)
          port: 22                             # Default SSH port
          script: |
            set -e # Stop script on first error

            # Define variables
            SITE_PATH="/home/${{ secrets.SERVER_USER }}/htdocs/crm.populatia.ro"
            DB_PATH="/home/${{ secrets.SERVER_USER }}/htdocs/crm.populatia.ro/dev.db"
            export DATABASE_URL="file:$DB_PATH"

            # Navigate to the site folder
            cd "$SITE_PATH"
            
            # Configure Git to trust the workspace folder
            git config --global --add safe.directory "$SITE_PATH"

            # Stop the app first
            pm2 stop all || npx pm2 stop all || true

            # Pull the latest code
            git fetch origin main
            git reset --hard origin/main
            
            # Reinstall dependencies
            rm -rf node_modules package-lock.json || true
            npm install --include=dev
            
            # Update Prisma ORM
            echo "Directly creating missing tables if needed..."
            sqlite3 "$DB_PATH" "
              CREATE TABLE IF NOT EXISTS tenants (
                id TEXT PRIMARY KEY,
                name TEXT NOT NULL,
                created_at DATETIME DEFAULT CURRENT_TIMESTAMP,
                updated_at DATETIME DEFAULT CURRENT_TIMESTAMP
              );
              
              CREATE TABLE IF NOT EXISTS rate_limit_entries (
                key TEXT PRIMARY KEY,
                count INTEGER NOT NULL DEFAULT 0,
                reset_at DATETIME NOT NULL,
                created_at DATETIME DEFAULT CURRENT_TIMESTAMP,
                updated_at DATETIME DEFAULT CURRENT_TIMESTAMP
              );
              
              CREATE TABLE IF NOT EXISTS audit_logs (
                id TEXT PRIMARY KEY,
                tenant_id TEXT,
                actor_user_id TEXT,
                action TEXT NOT NULL,
                success INTEGER NOT NULL DEFAULT 1,
                ip_address TEXT,
                user_agent TEXT,
                details TEXT,
                created_at DATETIME DEFAULT CURRENT_TIMESTAMP
              );

              CREATE TABLE IF NOT EXISTS project_rollovers (
                id TEXT PRIMARY KEY,
                tenant_id TEXT NOT NULL,
                source_project_id TEXT NOT NULL,
                new_project_id TEXT,
                target_year INTEGER NOT NULL,
                target_month INTEGER NOT NULL,
                created_at DATETIME DEFAULT CURRENT_TIMESTAMP
              );
            " || true
            
            # Add missing description column if it doesn't exist
            sqlite3 "$DB_PATH" "ALTER TABLE projects ADD COLUMN description TEXT;" || true

            # Now sync everything with Prisma
            npx prisma generate
            npx prisma db push --accept-data-loss
            
            # Build the Next.js application
            npm run build
            
            # Restart the Next.js app
            pm2 restart all || npx pm2 restart all
