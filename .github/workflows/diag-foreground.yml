name: Diag Foreground Start
on: [push, workflow_dispatch]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Foreground Start
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script: |
            SITE_PATH="/home/${{ secrets.SERVER_USER }}/htdocs/crm.populatia.ro"
            cd "$SITE_PATH"
            # Try to start the app in foreground to see errors
            # We timeout after 20s. If it succeeds, it should output "Ready in..."
            export DATABASE_URL="file:$SITE_PATH/dev.db"
            timeout 20s npm run start || true
