name: visual-regression

on:
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "tests/visual/**"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: "Update visual snapshots"
        required: false
        default: "false"

jobs:
  visual-suite-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      - run: npm run test:visual -- --list

  visual-capture:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run start -- -p 3000 &
      - run: |
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:3000/login >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - run: |
          if [ "${{ github.event.inputs.update_snapshots }}" = "true" ]; then
            npm run test:visual -- --project=desktop-chromium --update-snapshots
          else
            npm run test:visual -- --project=desktop-chromium
          fi
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/

