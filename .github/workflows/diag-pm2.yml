name: Diag PM2 Details
on: [push, workflow_dispatch]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: PM2 Diag
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script: |
            SITE_PATH="/home/${{ secrets.SERVER_USER }}/htdocs/crm.populatia.ro"
            cd "$SITE_PATH"
            # Find PM2 path
            PM2_EXE=$(which pm2 || find /home/${{ secrets.SERVER_USER }}/.nvm -name pm2 -type f | head -1 || echo "pm2")
            
            echo "--- PM2 STATUS ---"
            $PM2_EXE status
            
            echo "--- PM2 SHOW PIXELIST-CRM ---"
            $PM2_EXE show pixelist-crm
            
            echo "--- PORT 3000 STATUS ---"
            netstat -tulpn | grep :3000 || true
            
            echo "--- SITE LOGS (CLOUDPANEL) ---"
            # Check for CloudPanel app logs if they exist
            ls -la /home/${{ secrets.SERVER_USER }}/htdocs/crm.populatia.ro/logs/ || true
            tail -n 20 /home/${{ secrets.SERVER_USER }}/htdocs/crm.populatia.ro/logs/error.log 2>/dev/null || true
