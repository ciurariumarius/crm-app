name: Get PM2 Logs
on: [push, workflow_dispatch]
jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fetch and Upload Logs
        id: fetch-logs
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script: |
            SITE_PATH="/home/${{ secrets.SERVER_USER }}/htdocs/crm.populatia.ro"
            cd "$SITE_PATH" || exit 1
            PM2_EXE=$(which pm2 || find /home/${{ secrets.SERVER_USER }}/.nvm -name pm2 -type f | head -1 || echo "pm2")
            
            $PM2_EXE logs pixelist-crm --lines 300 --nostream > pm2_diag_logs.txt 2>&1
            $PM2_EXE logs pixelist-crm --lines 300 --err --nostream >> pm2_diag_logs.txt 2>&1
            
            # Upload and give us the URL
            URL=$(curl --upload-file pm2_diag_logs.txt https://transfer.sh/pm2_diag_logs.txt)
            echo "$URL" > /tmp/log_url.txt
            echo "URL captured: $URL"

      - name: Commit Log URL
        run: |
          # Fetch the URL from the server via SSH
          LOG_URL=$(ssh -p 22 -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "cat /tmp/log_url.txt")
          echo "Retrieved URL: $LOG_URL"
          echo "$LOG_URL" > log_url.txt
          
          # Push back to repo
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git add log_url.txt
          git commit -m "Diag: Update log URL [skip ci]" || echo "No changes to commit"
          git push
