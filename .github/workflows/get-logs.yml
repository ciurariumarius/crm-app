name: Get PM2 Logs
on: [push, workflow_dispatch]
jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Logs
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script: |
            SITE_PATH="/home/${{ secrets.SERVER_USER }}/htdocs/crm.populatia.ro"
            cd "$SITE_PATH"
            pm2 status > public/pm2_status.txt
            pm2 logs --lines 100 --nostream > public/pm2_logs.txt
            pm2 logs --lines 100 --err --nostream > public/pm2_errors.txt
